services:
    db:
        image: postgres:17
        environment:
            POSTGRES_DB: picodb
            POSTGRES_USER: pico
            POSTGRES_PASSWORD: pico
        ports:
            - '5432:5432'
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U pico -d picodb']
            interval: 10s
            timeout: 5s
            retries: 5

    db-test:
        image: postgres:17
        environment:
            POSTGRES_DB: picodb_test
            POSTGRES_USER: pico
            POSTGRES_PASSWORD: pico
        ports:
            - '5433:5432'

    app:
        build: .
        ports:
            - '4242:4242'
        depends_on:
            db:
                condition: service_healthy
        env_file:
            - .env
